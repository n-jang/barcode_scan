<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barcode Scanner</title>
<style>

/* =============================================
   SETTINGS — Edit these values to change the look.
   ============================================= */

:root {
    --background: #ffffff;
    --image-size: 500px;               /* Width of the image. Bigger number = bigger image. */
    --image-margin-left: 150px;        /* Space from the left edge to the image. */
    --name-size: 72px;                 /* Text size of the product name */
    --name-color: #1a1a1a;
    --name-padding: 48px;
    --code-size: 36px;
    --code-color: #999999;
    --ready-size: 72px;
    --ready-color: #999999;
    --notfound-size: 72px;             /* "Product not found" text size */
    --notfound-code-size: 48px;        /* Barcode number text size on not found screen */
    --notfound-color: #FF0000;         /* Pure red */
    --font: "Helvetica Neue", "Helvetica", Arial, sans-serif;
}

/* =============================================
   LAYOUT — Do not change below this line.
   ============================================= */

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; background: var(--background); font-family: var(--font); }
#scanner-input { position: fixed; top: -200px; left: -200px; width: 1px; height: 1px; opacity: 0; border: none; }
#ready-screen { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--ready-color); font-size: var(--ready-size); font-weight: 300; user-select: none; }
#product-display { display: none; height: 100%; }
.product-layout { display: flex; height: 100%; align-items: center; }
.image-side { display: flex; align-items: center; justify-content: center; padding-left: var(--image-margin-left); flex-shrink: 0; }
.image-side img { width: var(--image-size); height: auto; display: block; }
.name-side { flex: 1; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; padding: var(--name-padding); }
.product-name { font-size: var(--name-size); font-weight: 700; color: var(--name-color); line-height: 1.2; word-break: break-word; }
.product-code { margin-top: 16px; font-size: var(--code-size); color: var(--code-color); font-weight: 400; }
#notfound-screen { display: none; height: 100%; flex-direction: column; align-items: center; justify-content: center; gap: 20px; color: var(--notfound-color); font-size: var(--notfound-size); font-weight: 700; user-select: none; }
.notfound-code { font-size: var(--notfound-code-size); color: var(--notfound-color); font-weight: 400; }
#status { position: fixed; bottom: 12px; right: 16px; font-size: 20px; color: #999999; user-select: none; }

</style>
</head>
<body>

<input id="scanner-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" autofocus />
<div id="ready-screen">Ready to scan</div>
<div id="product-display">
    <div class="product-layout">
        <div class="image-side" id="image-container"></div>
        <div class="name-side">
            <div class="product-name" id="product-name"></div>
            <div class="product-code" id="product-code"></div>
        </div>
    </div>
</div>
<div id="notfound-screen">
    <div>Product not found</div>
    <div class="notfound-code" id="notfound-code"></div>
</div>
<div id="status">Loading…</div>

<script>
(function () {
    "use strict";

    var input = document.getElementById("scanner-input");
    var readyScreen = document.getElementById("ready-screen");
    var productDisplay = document.getElementById("product-display");
    var notfoundScreen = document.getElementById("notfound-screen");
    var imageContainer = document.getElementById("image-container");
    var productNameEl = document.getElementById("product-name");
    var productCodeEl = document.getElementById("product-code");
    var notfoundCodeEl = document.getElementById("notfound-code");
    var statusEl = document.getElementById("status");

    var lookup = {};
    var supportedExts = ["pdf", "jpg", "jpeg", "png", "gif", "svg", "webp"];
    var CACHE_KEY = "scanner_products";

    var host = window.location.hostname;
    var username = host.split(".")[0];
    var pathParts = window.location.pathname.split("/").filter(function (s) {
        return s.length > 0 && s.toLowerCase() !== "index.html";
    });
    var reponame = pathParts[0];
    if (!reponame) reponame = username + ".github.io";

    var apiUrl = "https://api.github.com/repos/" + username + "/" + reponame + "/contents/images";

    function refocus() { input.focus(); }
    document.addEventListener("click", refocus);
    document.addEventListener("touchstart", refocus);
    setInterval(refocus, 400);
    refocus();

    function showScreen(name) {
        readyScreen.style.display = name === "ready" ? "flex" : "none";
        productDisplay.style.display = name === "product" ? "block" : "none";
        notfoundScreen.style.display = name === "notfound" ? "flex" : "none";
    }

    /* Parse file list into lookup table */
    function parseFiles(files) {
        lookup = {};
        var count = 0;
        for (var i = 0; i < files.length; i++) {
            var f = files[i];
            var name = typeof f === "string" ? f : f.name;
            var type = typeof f === "string" ? "file" : f.type;
            if (type !== "file") continue;
            if (name.charAt(0) === "." || name.charAt(0) === "_") continue;

            var lastDot = name.lastIndexOf(".");
            if (lastDot === -1) continue;
            var ext = name.substring(lastDot + 1).toLowerCase();
            if (supportedExts.indexOf(ext) === -1) continue;

            var nameNoExt = name.substring(0, lastDot);
            var lastUnderscore = nameNoExt.lastIndexOf("_");
            if (lastUnderscore < 1) continue;

            var displayName = nameNoExt.substring(0, lastUnderscore);
            var fnsku = nameNoExt.substring(lastUnderscore + 1).toUpperCase();

            lookup[fnsku] = {
                name: displayName,
                code: fnsku,
                filename: name
            };
            count++;
        }
        return count;
    }

    /* Save product list to browser storage */
    function saveToCache(files) {
        try {
            var names = [];
            for (var i = 0; i < files.length; i++) {
                names.push({ name: files[i].name, type: files[i].type });
            }
            localStorage.setItem(CACHE_KEY, JSON.stringify(names));
        } catch (e) {}
    }

    /* Load product list from browser storage */
    function loadFromCache() {
        try {
            var data = localStorage.getItem(CACHE_KEY);
            if (data) return JSON.parse(data);
        } catch (e) {}
        return null;
    }

    /* Pre-download all images so they work offline */
    function preloadImages(count) {
        var keys = Object.keys(lookup);
        var loaded = 0;
        var total = keys.length;

        if (total === 0) {
            statusEl.textContent = count + " products loaded — offline ready";
            return;
        }

        statusEl.textContent = count + " products loaded — saving for offline…";

        for (var i = 0; i < keys.length; i++) {
            var img = new Image();
            img.onload = img.onerror = function () {
                loaded++;
                if (loaded >= total) {
                    statusEl.textContent = count + " products loaded — offline ready";
                }
            };
            img.src = "images/" + encodeURIComponent(lookup[keys[i]].filename);
        }
    }

    /* Main load function */
    function loadProducts() {
        fetch(apiUrl)
            .then(function (r) {
                if (!r.ok) throw new Error("error " + r.status);
                return r.json();
            })
            .then(function (files) {
                var count = parseFiles(files);
                saveToCache(files);
                preloadImages(count);
            })
            .catch(function () {
                /* Offline or error — try cached data */
                var cached = loadFromCache();
                if (cached) {
                    var count = parseFiles(cached);
                    statusEl.textContent = count + " products loaded — offline";
                } else {
                    statusEl.textContent = "No internet and no saved data";
                }
            });
    }

    function showProduct(p) {
        productNameEl.textContent = p.name;
        productCodeEl.textContent = p.code;
        imageContainer.innerHTML = "";

        var img = document.createElement("img");
        img.src = "images/" + encodeURIComponent(p.filename);
        img.alt = p.name;
        img.draggable = false;
        imageContainer.appendChild(img);

        showScreen("product");
    }

    function goFullscreen() {
        var el = document.documentElement;
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
            if (el.webkitRequestFullscreen) {
                el.webkitRequestFullscreen();
            } else if (el.requestFullscreen) {
                el.requestFullscreen();
            }
        }
    }

    input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
            e.preventDefault();
            goFullscreen();
            var code = input.value.trim();
            input.value = "";
            if (!code) return;

            var match = lookup[code.toUpperCase()];
            if (match) {
                showProduct(match);
            } else {
                notfoundCodeEl.textContent = code;
                showScreen("notfound");
            }
        }
    });

    showScreen("ready");
    loadProducts();

    /* Register service worker for offline use */
    if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js");
    }
})();
</script>
</body>
</html>
